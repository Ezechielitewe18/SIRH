<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GLOBIT SAS - Banniere 1600x900</title>
<link rel="stylesheet" href="identite.css">
<style>
  body { width: 1600px; height: 900px; }
  .page { position: relative; width: 1600px; height: 900px; padding: 70px 76px; overflow: hidden; }
  .halo1 { width: 620px; height: 620px; background: #2563EB; top: -260px; right: -200px; }
  .halo2 { width: 520px; height: 520px; background: #38BDF8; bottom: -280px; left: -180px; opacity: .42; }
  h1 { position: absolute; left: 76px; top: 196px; font-size: 82px; line-height: 1.06; font-weight: 800; letter-spacing: -2.4px; width: 760px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #38BDF8, #A5B4FC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .accroche { position: absolute; left: 76px; top: 452px; width: 700px; font-size: 25px; line-height: 1.5; color: #CBD5F5; }
  .logo { position: absolute; left: 76px; top: 70px; display: flex; align-items: center; gap: 15px; }
  .logo .bloc { width: 60px; height: 60px; border-radius: 15px; background: linear-gradient(135deg, #38BDF8, #2563EB); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #04122B; font-size: 29px; }
  .logo .nom { font-size: 29px; font-weight: 800; }
  .logo .nom span { display: block; font-size: 13px; letter-spacing: 2.6px; color: var(--gris); text-transform: uppercase; font-weight: 600; }
  .offre { position: absolute; left: 76px; top: 596px; display: inline-block; padding: 20px 34px; border-radius: 14px; background: linear-gradient(90deg, #38BDF8, #2563EB); color: #04122B; font-weight: 800; font-size: 27px; }
  .contact { position: absolute; left: 76px; top: 690px; font-size: 21px; color: var(--gris); line-height: 1.6; }
  .contact b { color: var(--clair); }
  .ecran { position: absolute; right: 60px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(122,160,255,.32); box-shadow: 0 30px 90px rgba(0,0,0,.55); transform: rotate(-2deg); }
</style>
</head>
<body>
<div class="page grille">
  <div class="halo halo1"></div>
  <div class="halo halo2"></div>

  <div class="logo">
    <div class="bloc">G</div>
    <div class="nom">GLOBIT SAS<span>SIRH</span></div>
  </div>

  <h1>Le SIRH pensé<br>pour <em>les entreprises<br>congolaises</em>.</h1>
  <p class="accroche">Présences par QR, congés, paie et rapports. Dans le cloud, en français, avec installation et formation incluses.</p>
  <span class="offre">Demander une démo</span>
  <div class="contact"><b>Startup GLOBIT SAS</b> · RDC &nbsp;·&nbsp; 📞 +243 00 000 0000 &nbsp;·&nbsp; ✉️ contact@globit.com</div>

  <div class="ecran"><img src="../captures/dashboard.png" alt="Tableau de bord"></div>
</div>
</body>
</html>
